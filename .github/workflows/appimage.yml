name: AppImage Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson valac libgtk-4-dev libadwaita-1-dev \
            libsqlite3-dev libgee-0.8-dev blueprint-compiler \
            gettext libfuse2 wget

          # Download appimagetool from GitHub Releases
          wget -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build with Meson
        run: |
          meson setup build --prefix=/usr
          meson compile -C build

      - name: Create AppImage
        run: |
          chmod +x ./build-appimage.sh
          ./build-appimage.sh

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bloom-x86_64.AppImage
          draft: false
