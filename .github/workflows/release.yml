name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bloom-${{ matrix.arch }}.flatpak
          manifest-path: io.github.oatbiscuit.bloom.json
          cache-key: flatpak-builder-${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: bloom-${{ matrix.arch }}.flatpak

  source-tarball:
    name: Build Source Tarball
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson valac blueprint-compiler \
            libgtk-4-dev libadwaita-1-dev libsqlite3-dev libgee-0.8-dev \
            libglib2.0-dev desktop-file-utils gettext

      - name: Generate source tarball
        run: |
          meson setup build-dist
          meson dist -C build-dist --no-tests

      - name: Upload source tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-tarball
          path: build-dist/meson-dist/*.tar.xz

  rpm:
    name: Build RPM
    needs: [source-tarball]
    runs-on: ubuntu-26.04
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools tar gzip meson valac blueprint-compiler \
            gtk4-devel libadwaita-devel sqlite-devel libgee-devel glib2-devel \
            desktop-file-utils gettext

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: source-tarball
          path: artifacts

      - name: Build RPM
        run: |
          rpmdev-setuptree
          VERSION="${GITHUB_REF_NAME#v}"

          TARBALL=$(find artifacts -name "bloom-*.tar.xz")
          if [ -z "$TARBALL" ]; then
            echo "Error: Source tarball not found!"
            exit 1
          fi

          cp "$TARBALL" ~/rpmbuild/SOURCES/bloom-${VERSION}.tar.xz
          cp bloom.spec ~/rpmbuild/SPECS/

          rpmbuild -bb \
            --define "version ${VERSION}" \
            --define "_sourcedir ~/rpmbuild/SOURCES" \
            ~/rpmbuild/SPECS/bloom.spec

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/**/*.rpm

  release:
    name: Publish Release
    needs: [flatpak, source-tarball, rpm]
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename artifacts to include version and arch
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mv artifacts/flatpak-bundle-x86_64/bloom-x86_64.flatpak \
             "artifacts/flatpak-bundle-x86_64/bloom-${VERSION}-x86_64.flatpak"

          mv artifacts/flatpak-bundle-aarch64/bloom-aarch64.flatpak \
             "artifacts/flatpak-bundle-aarch64/bloom-${VERSION}-aarch64.flatpak"

          TARBALL=$(find artifacts/source-tarball -name "bloom-*.tar.xz")
          mv "$TARBALL" "artifacts/source-tarball/bloom-${VERSION}-source.tar.xz"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/flatpak-bundle-x86_64/*.flatpak
            artifacts/flatpak-bundle-aarch64/*.flatpak
            artifacts/source-tarball/*.tar.xz
            artifacts/rpm-package/*.rpm
          draft: false
